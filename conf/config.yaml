# Root config. Composes a difficulty (defaults list) + shared params.
# Override anything on the CLI, e.g.  python eval.py difficulty=hard checkpoint=<path>
defaults:
  - difficulty: easy
  - _self_

seed: 0
num_envs: 8               # for eval/test; scale up as GPU allows
device: cuda
control_mode: pd_ee_delta_pos
# max_episode_steps is set PER-DIFFICULTY in conf/difficulty/{easy,medium,hard}.yaml, not here --
# Hydra's defaults list loads difficulty: before _self_, so a value set here would always win
# and silently override whatever the difficulty config sets. Our ACT checkpoints for
# medium/hard were trained & validated with longer episodes (more parcels need more steps),
# so this submission needs per-difficulty episode length to score correctly without judges
# having to pass an extra max_episode_steps= override by hand.

# observation mode (state | rgb). This submission is the image track (ACT).
obs_mode: rgb

camera:
  width: 128
  height: 128

# the rgb obs comes from a single fixed third-person "scene" camera (the only image input)
obs_camera: scene

# checkpoint path (for eval.py / the judge)
checkpoint: null
# eval config file path (eval.py only)
eval_config: null
# policy entrypoint "module:function" — required for eval.py / the judge
# e.g.  policy=warehouse_sort.il_policy:load_dp_rgb
policy: null
