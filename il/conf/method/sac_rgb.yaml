# @package _global_
# RGB SAC: image + robot proprioception only (NO privileged state), off-policy RL from the
# sparse +1-per-parcel reward, with the replay buffer pre-seeded by replaying the provided demo
# actions through a real env instance (ground-truth reward, no hand reconstruction). Fixed image
# input -> the SAME policy can run across difficulties.
baseline_dir: sac
script: sac_rgbd.py
demo_kind: rgb
flags:
  obs_mode: rgb
  num_envs: 16
  num_eval_envs: 8
  num_eval_steps: 200  # must reach max_episode_steps (200) since eval envs use ignore_terminations
                        # (always run to full length) -- shorter and no episode ever completes
  total_timesteps: 50000  # GPU-bound at ~7.5 it/s on a T4 (97% util) -> ~1.5-2hr wall-clock;
                           # 500k would take ~18hr, infeasible for a 1-day hackathon budget
  buffer_size: 36000  # ONLINE buffer only now (separate from demo_buffer_size below) -- 128x128 rgb
                       # needs ~4x less capacity than upstream's 64x64 example to fit GPU memory
  demo_buffer_size: 24000  # separate, never-overwritten demo buffer (easy has 200 eps x 115 steps
                            # = 23000 transitions); combined with buffer_size, same ~60k total as
                            # the single-buffer version that was already validated to fit GPU memory
  demo_ratio: 0.5  # RLPD-style: 50% of every training batch always sampled from the demo buffer
  training_freq: 64
  utd: 0.5
  batch_size: 512
  learning_starts: 4000
  eval_freq: 5000
  log_freq: 1000
  capture_video: true
  num_seed_demos: 200
  exp_name: warehouse_rgb_sac
