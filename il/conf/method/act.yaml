# @package _global_
# State ACT (Action Chunking Transformer, CVAE + transformer decoder): privileged low-dim
# state observations. State input is parcel-count-specific, so train one checkpoint PER level.
baseline_dir: act
script: train.py
demo_kind: state
flags:
  num_queries: 30
  temporal_agg: true
  total_iters: 30000
  batch_size: 256
  lr: 1e-4
  kl_weight: 10
  enc_layers: 2
  dec_layers: 4
  dim_feedforward: 512
  hidden_dim: 256
  nheads: 4
  num_eval_envs: 4
  num_eval_episodes: 8
  eval_freq: 5000
  log_freq: 1000
  save_freq: 10000
  capture_video: false
  exp_name: warehouse_state_act_easy
